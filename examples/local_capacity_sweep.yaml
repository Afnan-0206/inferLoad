experiment:
  name: "local-capacity-sweep"
  description: "Calibrated controlled capacity sweep measuring TTFT, total latency, and throughput across concurrency levels on local Ollama endpoint"
  output_dir: "results"

target:
  base_url: "http://127.0.0.1:11434/v1"
  model: "qwen2.5:0.5b"
  timeout_seconds: 60.0

workload:
  prompts:
    - "Explain the concept of memory hierarchy in computing."
    - "Write a concise summary of how a CPU cache line works."
    - "What is the key difference between latency and throughput in computer networks?"
  max_tokens: 32
  temperature: 0.0
  stream: true
  seed: 42

sweep:
  concurrency:
    - 1
    - 2
    - 4
  repetitions: 3
  requests_per_point: 20

execution:
  warmup_requests: 5
  streaming: true

arrival:
  mode: "closed"
